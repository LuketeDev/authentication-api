services:
  postgres:
    image: postgres:17-alpine
    container_name: authentication-postgres
    environment:
      POSTGRES_DB: authentication
      POSTGRES_USER: authentication
      POSTGRES_PASSWORD: authentication
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentication -d authentication"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: authentication-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/authentication
      DB_USERNAME: authentication
      DB_PASSWORD: authentication
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
