spring:
  application:
    name: authentication-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authentication}
    username: ${DB_USERNAME:authentication}
    password: ${DB_PASSWORD:authentication}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdLZXlGb3JUZXN0aW5nMTIzNDU2Nzg5MA==
  expiration: 3600